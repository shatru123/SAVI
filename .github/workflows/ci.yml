name: SAVI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore /m:1 SAVI.sln

    - name: Build Solution
      run: dotnet build /m:1 --no-restore --configuration Release SAVI.sln

    - name: Run Tests
      run: dotnet test --no-build --configuration Release --verbosity normal SAVI.sln
